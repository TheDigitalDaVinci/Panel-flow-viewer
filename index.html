<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>PanelFlow part viewer</title>
<!-- PanelFlow site viewer: shows the cabinet with the scanned part highlighted.
     Everything it draws comes from the link's #fragment (written by the part label QR); no data is stored on any server.
     Host this one file (plus sw.js) anywhere: GitHub Pages, Netlify, your website. -->
<style>
  :root { --bg: #f3f4f6; --card: #fff; --ink: #111827; --mut: #6b7280; --line: #e5e7eb; --hi: #f59e0b; --hiD: #b45309; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  header { background: #1f2937; color: #fff; padding: 12px 16px; display: flex; align-items: baseline; gap: 10px; }
  header b { font-size: 26px; color: var(--hi); letter-spacing: .5px; }
  header span { font-size: 17px; font-weight: 600; }
  main { padding: 12px 16px 24px; max-width: 900px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .size { font-size: 28px; font-weight: 800; }
  .size small { font-size: 16px; color: var(--mut); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 4px; }
  .row div { min-width: 120px; } .row i { display: block; font-style: normal; font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .5px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .seg button { flex: 1 1 auto; min-height: 42px; padding: 8px 10px; border: 1px solid #cbd5e1; background: #fff; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .seg button.on { background: #1f2937; color: #fff; border-color: #1f2937; }
  #view { width: 100%; height: auto; aspect-ratio: 10 / 7; display: block; background: #fff; border-radius: 10px; border: 1px solid var(--line); touch-action: manipulation; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--mut); margin-top: 6px; flex-wrap: wrap; }
  .legend span::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); border: 1px solid #0003; }
  .eb { display: grid; grid-template-columns: 1fr 2fr 1fr; grid-template-rows: auto auto auto; align-items: center; justify-items: center; gap: 4px; max-width: 320px; margin-top: 6px; font-size: 13px; }
  .eb .p { grid-column: 2; grid-row: 2; width: 100%; height: 54px; border: 1px solid #94a3b8; background: #f8fafc; display: flex; align-items: center; justify-content: center; color: var(--mut); font-size: 12px; position: relative; }
  .eb b { font-size: 14px; }
  .empty { text-align: center; padding: 40px 16px; color: var(--mut); }
  svg text { font-family: system-ui, Arial, sans-serif; }
  #mode button { flex: 1 1 22%; padding: 8px 4px; font-size: 14px; }
  .seg.look button { min-height: 38px; padding: 6px 4px; font-size: 14px; flex: 1 1 12%; }
  .v3d { cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; } .v3d:active { cursor: grabbing; }
  .v3d .hi { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .v3d .hi { animation: none; } }
</style>
</head>
<body>
<header><b id="hCode">PanelFlow</b><span id="hName">Part viewer</span></header>
<main id="app"><div class="empty">Scan the QR code on a PanelFlow part label to see where the part goes.</div></main>
<script>
'use strict';
(function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dec = s => { const t = String(s || '').replace(/\+/g, ' '); try { return decodeURIComponent(t); } catch (e) { return t; } };
  const n36 = s => parseInt(s, 36) || 0;
  const fmt = v => (Math.round(v * 10) / 10).toString();

  /* ---------- decode the label link (formats v2 and v1, see PanelFlow exports.js) ---------- */
  function parse(hash) {
    const f = hash.replace(/^#/, '').split('~');
    if (f[0] === '2' && f.length >= 10) {
      const t = f[9].split(':');
      const [W, H, D] = t[0].split('.').map(n36), [L, Wp, T] = t[1].split('.').map(v => n36(v) / 10);
      const [wall, x] = dec(f[4]).split('@');
      const raw = (t[4] || '').split('*').filter(Boolean);
      const boxes = raw.map((s, i) => {
        if (s === 'N') return null;
        const m = i === 0 ? 0.1 : 10, v = s.slice(1).split('.').map(n36);
        return { k: s[0].toLowerCase(), x: v[0] * m, y: v[1] * m, d: v[2] * m, w: v[3] * m, h: v[4] * m, dd: v[5] * m, rot: v[6] || 0 };
      });
      const sel = boxes[0] ? 0 : -1;
      return { project: dec(f[1]), label: dec(f[2]), cabName: dec(f[3]), wall, wallX: x, W, H, D, id: dec(f[5]), code: dec(f[6]), name: dec(f[7]),
        L, Wp, T, mat: dec(f[8]), eb: (t[2] || '').split('.').map(v => n36(v) / 10), piece: t[3] || '', boxes: boxes.filter(Boolean), sel };
    }
    if (f[0] !== '1' || f.length < 15) return null;
    const [W, H, D] = f[5].split('.').map(n36);
    const [L, Wp, T] = f[9].split('x').map(Number);
    const [wall, x] = dec(f[4]).split('@');
    const boxes = (f[13] || '').split('_').filter(Boolean).map(s => {
      const up = s[0] !== s[0].toLowerCase(), m = up ? 5 : 0.1, k = s[0].toLowerCase(), v = s.slice(1).split('.').map(n36);
      return { k, x: v[0] * m, y: v[1] * m, d: v[2] * m, w: v[3] * m, h: v[4] * m, dd: v[5] * m, rot: v[6] || 0 };
    });
    return { project: dec(f[1]), label: dec(f[2]), cabName: dec(f[3]), wall, wallX: x, W, H, D, id: dec(f[6]), code: dec(f[7]), name: dec(f[8]),
      L, Wp, T, mat: dec(f[10]), eb: f[11].split(',').map(Number), piece: f[12], boxes, sel: parseInt(f[14], 10) };
  }

  /* bounding box of a (possibly turned) box */
  function bb(b) {
    if (!b.rot) return { x0: b.x, x1: b.x + b.w, y0: b.y, y1: b.y + b.h, d0: b.d, d1: b.d + b.dd };
    const a = b.rot * Math.PI / 180, cx = b.x + b.w / 2, cd = b.d + b.dd / 2;
    const ex = Math.abs(Math.cos(a)) * b.w / 2 + Math.abs(Math.sin(a)) * b.dd / 2, ed = Math.abs(Math.sin(a)) * b.w / 2 + Math.abs(Math.cos(a)) * b.dd / 2;
    return { x0: cx - ex, x1: cx + ex, y0: b.y, y1: b.y + b.h, d0: cd - ed, d1: cd + ed };
  }
  /* turn the whole cabinet by quarter turns (seen from above, clockwise: the right side comes to the front) */
  function turn(q, W, D, k) {
    let r = Object.assign({}, q), w = W, dd = D;
    for (let i = 0; i < k; i++) { r = { x0: r.d0, x1: r.d1, y0: r.y0, y1: r.y1, d0: w - r.x1, d1: w - r.x0 }; const t = w; w = dd; dd = t; }
    return r;
  }

  const FILL = { c: '#e8d9bd', s: '#9db8d0', b: '#cbb791', d: '#efe4cc' };
  const STROKE = { c: '#6b5435', s: '#2b5d8a', b: '#6b5435', d: '#8b7355' };

  function draw(data, mode, k, see) {
    const svgW = 1000, svgH = 700, pad = 70;
    const sel = data.boxes[data.sel];
    let items = data.boxes.map((b, i) => ({ b, i, q: bb(b) }));
    const ext = items.reduce((m, it) => ({ x0: Math.min(m.x0, it.q.x0), x1: Math.max(m.x1, it.q.x1), y0: Math.min(m.y0, it.q.y0), y1: Math.max(m.y1, it.q.y1), d0: Math.min(m.d0, it.q.d0), d1: Math.max(m.d1, it.q.d1) }), { x0: 0, x1: data.W, y0: 0, y1: data.H, d0: 0, d1: data.D });
    items.forEach(it => { it.q = { x0: it.q.x0 - ext.x0, x1: it.q.x1 - ext.x0, y0: it.q.y0, y1: it.q.y1, d0: it.q.d0 - ext.d0, d1: it.q.d1 - ext.d0 }; });
    let W = ext.x1 - ext.x0, D = ext.d1 - ext.d0; const H = ext.y1;
    if (mode === '3d' && k) { items.forEach(it => { it.q = turn(it.q, W, D, k); }); if (k % 2) { const t = W; W = D; D = t; } }
    const polys = [], texts = [];
    let P, sc, ox, oy, bounds;
    if (mode === '3d') {
      const kx = 0.45, ky = 0.32;   // oblique: depth recedes up and to the right
      P = (x, y, d) => [x + d * kx, y + d * ky];
      bounds = { u0: 0, u1: W + D * kx, v0: Math.min(0, ext.y0), v1: H + D * ky };
    } else if (mode === 'front') { P = (x, y) => [x, y]; bounds = { u0: 0, u1: W, v0: Math.min(0, ext.y0), v1: H }; }
    else if (mode === 'side') { P = (x, y, d) => [d, y]; bounds = { u0: 0, u1: D, v0: Math.min(0, ext.y0), v1: H }; }
    else { P = (x, y, d) => [x, D - d]; bounds = { u0: 0, u1: W, v0: 0, v1: D }; }
    sc = Math.min((svgW - 2 * pad) / Math.max(1, bounds.u1 - bounds.u0), (svgH - 2 * pad) / Math.max(1, bounds.v1 - bounds.v0));
    ox = pad + ((svgW - 2 * pad) - (bounds.u1 - bounds.u0) * sc) / 2 - bounds.u0 * sc;
    oy = svgH - pad - ((svgH - 2 * pad) - (bounds.v1 - bounds.v0) * sc) / 2 + bounds.v0 * sc;
    const S = ([u, v]) => [ox + u * sc, oy - v * sc];
    const pt = a => a.map(p => S(p).map(n => n.toFixed(1)).join(',')).join(' ');
    const near = q => mode === '3d' ? (q.x0 + q.x1) * 0.25 + (q.y0 + q.y1) * 0.2 - (q.d0 + q.d1) * 0.6
      : mode === 'front' ? -q.d0 : mode === 'side' ? q.x1 : q.y1;
    items.sort((a, c) => (a.i === data.sel) - (c.i === data.sel) || near(a.q) - near(c.q));
    items.forEach(it => {
      const q = it.q, hi = it.i === data.sel, k0 = it.b.k;
      const fill = hi ? '#f59e0b' : FILL[k0] || '#ddd', st = hi ? '#92400e' : STROKE[k0] || '#555';
      const op = hi ? 1 : see ? (k0 === 's' ? 0.15 : 0.5) : (k0 === 's' ? 0.4 : 0.95);
      const sw = hi ? 3 : 1;
      if (mode === '3d') {
        const f = [[q.x0, q.y0, q.d0], [q.x1, q.y0, q.d0], [q.x1, q.y1, q.d0], [q.x0, q.y1, q.d0]].map(a => P(...a));
        const t = [[q.x0, q.y1, q.d0], [q.x1, q.y1, q.d0], [q.x1, q.y1, q.d1], [q.x0, q.y1, q.d1]].map(a => P(...a));
        const r = [[q.x1, q.y0, q.d0], [q.x1, q.y0, q.d1], [q.x1, q.y1, q.d1], [q.x1, q.y1, q.d0]].map(a => P(...a));
        polys.push(`<g opacity="${op}"><polygon points="${pt(r)}" fill="${fill}" stroke="${st}" stroke-width="${sw}" style="filter:brightness(.82)"/><polygon points="${pt(t)}" fill="${fill}" stroke="${st}" stroke-width="${sw}" style="filter:brightness(1.08)"/><polygon points="${pt(f)}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/></g>`);
      } else {
        const a = P(q.x0, q.y0, q.d0), b = P(q.x1, q.y1, q.d1);
        const u0 = Math.min(a[0], b[0]), u1 = Math.max(a[0], b[0]), v0 = Math.min(a[1], b[1]), v1 = Math.max(a[1], b[1]);
        polys.push(`<polygon opacity="${op}" points="${pt([[u0, v0], [u1, v0], [u1, v1], [u0, v1]])}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`);
        if (hi) {
          // where the part sits: distance from the left / bottom (front, side) or from the left / front (top)
          const dim = (x1, y1, x2, y2, txt, vert) => {
            const A = S([x1, y1]), B = S([x2, y2]);
            texts.push(`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#b45309" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>`);
            const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
            texts.push(`<text x="${vert ? mx - 8 : Math.min(A[0], B[0]) + 4}" y="${my + (vert ? 0 : -8)}" font-size="22" font-weight="700" fill="#92400e" text-anchor="${vert ? 'middle' : 'start'}"${vert ? ` transform="rotate(-90 ${mx - 8} ${my})"` : ''}>${esc(txt)}</text>`);
          };
          const sz = (u1 - u0), szv = (v1 - v0);
          if (u0 > 1) dim(0, v0 + szv / 2, u0, v0 + szv / 2, fmt(u0) + ' from ' + (mode === 'side' ? 'front' : 'left'));
          if (v0 > 1) dim(u0 + sz / 2, 0, u0 + sz / 2, v0, fmt(v0) + (mode === 'top' ? ' from back' : ' up'), true);
        }
      }
    });
    // overall size
    const ow = mode === 'side' ? D : W, oh = mode === 'top' ? D : H;
    const lab = [];
    if (mode !== '3d') {
      const a = S([0, bounds.v0]), b = S([ow, bounds.v0]), c = S([ow, 0]), d = S([ow, oh]);
      lab.push(`<line x1="${a[0]}" y1="${a[1] + 30}" x2="${b[0]}" y2="${b[1] + 30}" stroke="#64748b" marker-start="url(#ar2)" marker-end="url(#ar2)"/><text x="${(a[0] + b[0]) / 2}" y="${a[1] + 56}" font-size="22" fill="#334155" text-anchor="middle">${fmt(ow)}</text>`);
      lab.push(`<line x1="${c[0] + 30}" y1="${c[1]}" x2="${d[0] + 30}" y2="${d[1]}" stroke="#64748b" marker-start="url(#ar2)" marker-end="url(#ar2)"/><text x="${c[0] + 56}" y="${(c[1] + d[1]) / 2}" font-size="22" fill="#334155" text-anchor="middle" transform="rotate(-90 ${c[0] + 56} ${(c[1] + d[1]) / 2})">${fmt(oh)}</text>`);
    }
    const title = { '3d': ['FRONT', 'RIGHT SIDE', 'BACK', 'LEFT SIDE'][k % 4] + ' in front', front: 'FRONT VIEW', side: 'RIGHT SIDE VIEW (front on the left)', top: 'TOP VIEW (front at the bottom)' }[mode];
    return `<svg id="view" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg"><defs>
      <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
      <marker id="ar2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
      <text x="20" y="34" font-size="24" font-weight="700" fill="#374151">${esc(title)}</text>${polys.join('')}${texts.join('')}${lab.join('')}${sel ? '' : '<text x="500" y="680" font-size="20" fill="#b91c1c" text-anchor="middle">This part has no position in the drawing</text>'}</svg>`;
  }

  /* ---------- interactive 3D: one finger turns, two fingers pinch-zoom / move, double-tap resets ----------
   * small built-in renderer: boards are boxes; visible faces only; boards ordered back-to-front with
   * separating planes (correct for boards that don't overlap), shaded by a fixed light. */
  const LOOK = { front: [0, 0], right: [-90, 0], back: [180, 0], left: [90, 0], top: [0, 89], start: [-32, 22] };
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const shadeHex = (h, k) => 'rgb(' + hex(h).map(v => Math.max(0, Math.min(255, Math.round(v * k)))).join(',') + ')';
  function mount3d(wrap, data, st) {
    const its = data.boxes.map((b, i) => ({ b, i, q: bb(b) }));
    const E = its.reduce((m, it) => ({ x0: Math.min(m.x0, it.q.x0), x1: Math.max(m.x1, it.q.x1), y0: Math.min(m.y0, it.q.y0), y1: Math.max(m.y1, it.q.y1), d0: Math.min(m.d0, it.q.d0), d1: Math.max(m.d1, it.q.d1) }), { x0: 0, x1: data.W, y0: 0, y1: data.H, d0: 0, d1: data.D });
    const cx = (E.x0 + E.x1) / 2, cy = (E.y0 + E.y1) / 2, cd = (E.d0 + E.d1) / 2;
    const diag = Math.hypot(E.x1 - E.x0, E.y1 - E.y0, E.d1 - E.d0) || 1;
    // world: X right, Y up, Z towards the front (viewer)
    its.forEach(it => {
      const q = it.q;
      it.lo = [q.x0 - cx, q.y0 - cy, cd - q.d1]; it.hi = [q.x1 - cx, q.y1 - cy, cd - q.d0];
      it.c = [0, 1, 2, 3, 4, 5, 6, 7].map(n => [n & 1 ? it.hi[0] : it.lo[0], n & 2 ? it.hi[1] : it.lo[1], n & 4 ? it.lo[2] : it.hi[2]]);
    });
    // faces: corner indices + outward normal (corner bit 4 = back)
    const F = [[[0, 1, 3, 2], [0, 0, 1]], [[5, 4, 6, 7], [0, 0, -1]], [[4, 0, 2, 6], [-1, 0, 0]], [[1, 5, 7, 3], [1, 0, 0]], [[2, 3, 7, 6], [0, 1, 0]], [[4, 5, 1, 0], [0, -1, 0]]];
    const L = (() => { const v = [0.35, 0.85, 0.5], n = Math.hypot(...v); return v.map(a => a / n); })();
    const cam = st.cam || (st.cam = { yaw: LOOK.start[0], pitch: LOOK.start[1], zoom: 1, px: 0, py: 0 });
    wrap.innerHTML = `<svg id="view" class="v3d" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg"><g id="scene"></g>
      <text x="20" y="34" font-size="22" font-weight="600" fill="#6b7280">Drag to turn · pinch to zoom · double-tap to reset</text></svg>`;
    const svg = wrap.querySelector('svg'), g = svg.querySelector('#scene');
    let raf = 0;
    function draw() {
      raf = 0;
      const ya = cam.yaw * Math.PI / 180, pa = cam.pitch * Math.PI / 180, cY = Math.cos(ya), sY = Math.sin(ya), cP = Math.cos(pa), sP = Math.sin(pa);
      const dist = diag * 2.8, s = 600 / diag * cam.zoom;
      const rot = ([X, Y, Z]) => { const X1 = X * cY + Z * sY, Z1 = -X * sY + Z * cY; return [X1, Y * cP - Z1 * sP, Y * sP + Z1 * cP]; };
      const proj = p => { const r = rot(p), f = dist / (dist - r[2]); return [500 + cam.px + r[0] * s * f, 370 + cam.py - r[1] * s * f]; };
      const camW = [-dist * cP * sY, dist * sP, dist * cP * cY];   // camera position in world
      // back-to-front order: for two boards split by a plane, the one on the camera's side is drawn later
      const n = its.length, after = its.map(() => []), indeg = new Array(n).fill(0);
      for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) {
        const A = its[a], B = its[b];
        for (let k = 0; k < 3; k++) {
          let first = -1;
          if (A.hi[k] <= B.lo[k] + 0.5) first = camW[k] > (A.hi[k] + B.lo[k]) / 2 ? a : b;
          else if (B.hi[k] <= A.lo[k] + 0.5) first = camW[k] > (B.hi[k] + A.lo[k]) / 2 ? b : a;
          if (first < 0) continue;
          const second = first === a ? b : a; after[first].push(second); indeg[second]++; break;
        }
      }
      const depth = it => { const c = [(it.lo[0] + it.hi[0]) / 2, (it.lo[1] + it.hi[1]) / 2, (it.lo[2] + it.hi[2]) / 2]; return rot(c)[2]; };
      const order = [], ready = [];
      for (let i = 0; i < n; i++) if (!indeg[i]) ready.push(i);
      const left = new Set(its.map((_, i) => i));
      while (left.size) {
        if (!ready.length) { let best = null; left.forEach(i => { if (best == null || depth(its[i]) < depth(its[best])) best = i; }); ready.push(best); }  // cycle: nearest-centre fallback
        ready.sort((x, y) => depth(its[y]) - depth(its[x]));
        const i = ready.pop(); if (!left.has(i)) continue; left.delete(i); order.push(i);
        after[i].forEach(j => { if (--indeg[j] === 0 && left.has(j)) ready.push(j); });
      }
      if (st.see) { const k = order.findIndex(i => its[i].i === data.sel); if (k >= 0) order.push(order.splice(k, 1)[0]); }
      const out = [];
      order.forEach(idx => {
        const it = its[idx], hi = it.i === data.sel, kind = it.b.k;
        const base = hi ? '#f59e0b' : FILL[kind] || '#dddddd', stroke = hi ? '#92400e' : STROKE[kind] || '#555';
        const op = hi ? 1 : st.see ? (kind === 's' ? 0.15 : 0.5) : (kind === 's' ? 0.45 : 1);
        const P = it.c.map(proj);
        let faces = '';
        F.forEach(([ix, nrm]) => {
          // visible when the camera is in front of the face plane
          const p0 = it.c[ix[0]], toCam = [camW[0] - p0[0], camW[1] - p0[1], camW[2] - p0[2]];
          if (nrm[0] * toCam[0] + nrm[1] * toCam[1] + nrm[2] * toCam[2] <= 0) return;
          const k = 0.72 + 0.32 * Math.max(0, nrm[0] * L[0] + nrm[1] * L[1] + nrm[2] * L[2]);
          faces += `<polygon points="${ix.map(j => P[j][0].toFixed(1) + ',' + P[j][1].toFixed(1)).join(' ')}" fill="${shadeHex(base, k)}" stroke="${stroke}" stroke-width="${hi ? 2.5 : 1}" stroke-linejoin="round"/>`;
        });
        out.push(`<g opacity="${op}"${hi ? ' class="hi"' : ''}>${faces}</g>`);
      });
      // which way is the front: a marker on the floor in front of the box
      const fy = E.y0 - cy, fz = cd - E.d0 + diag * 0.08, a = proj([0, fy, fz]);
      out.push(`<text x="${a[0].toFixed(1)}" y="${(a[1] + 6).toFixed(1)}" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">▲ FRONT</text>`);
      if (data.sel < 0) out.push('<text x="500" y="680" font-size="20" fill="#b91c1c" text-anchor="middle">This part has no position in the drawing</text>');
      g.innerHTML = out.join('');
    }
    const req = () => { if (!raf) raf = requestAnimationFrame(draw); };
    // swing smoothly to a named view
    let anim = 0;
    function look(name) {
      const t = LOOK[name] || LOOK.start, y0 = cam.yaw, p0 = cam.pitch, z0 = cam.zoom, x0 = cam.px, q0 = cam.py;
      let dy = ((t[0] - y0) % 360 + 540) % 360 - 180;           // shortest way round
      const t0 = performance.now(), dur = 450, reset = name === 'start';
      cancelAnimationFrame(anim);
      const step = now => {
        const u = Math.min(1, (now - t0) / dur), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        cam.yaw = y0 + dy * e; cam.pitch = p0 + (t[1] - p0) * e;
        if (reset) { cam.zoom = z0 + (1 - z0) * e; cam.px = x0 * (1 - e); cam.py = q0 * (1 - e); }
        draw(); if (u < 1) anim = requestAnimationFrame(step);
      };
      anim = requestAnimationFrame(step);
    }
    // touch / mouse
    const pts = new Map(); let lastTap = 0, tapPos = null, moved = false;
    const k = () => 1000 / (svg.clientWidth || 1000);
    svg.style.touchAction = 'none';
    svg.addEventListener('pointerdown', e => {
      e.preventDefault(); svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; cancelAnimationFrame(anim);
      const now = Date.now();
      if (pts.size === 1 && now - lastTap < 320 && tapPos && Math.hypot(e.clientX - tapPos.x, e.clientY - tapPos.y) < 30) { look('start'); lastTap = 0; return; }
      lastTap = now; tapPos = { x: e.clientX, y: e.clientY };
    });
    svg.addEventListener('pointermove', e => {
      const p = pts.get(e.pointerId); if (!p) return;
      const all = [...pts.values()];
      if (all.length === 1) {
        const dx = e.clientX - p.x, dy = e.clientY - p.y;
        if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
        cam.yaw += dx * 0.45; cam.pitch = Math.max(-89, Math.min(89, cam.pitch + dy * 0.45));
      } else if (all.length >= 2) {
        const o = all.find(q => q !== p);
        const d0 = Math.hypot(p.x - o.x, p.y - o.y), d1 = Math.hypot(e.clientX - o.x, e.clientY - o.y);
        if (d0 > 10) cam.zoom = Math.max(0.4, Math.min(6, cam.zoom * d1 / d0));
        cam.px += (e.clientX - p.x) / 2 * k(); cam.py += (e.clientY - p.y) / 2 * k();
        moved = true;
      }
      p.x = e.clientX; p.y = e.clientY; req();
    });
    const up = e => { pts.delete(e.pointerId); if (moved) lastTap = 0; };
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
    svg.addEventListener('wheel', e => { e.preventDefault(); cam.zoom = Math.max(0.4, Math.min(6, cam.zoom * (e.deltaY > 0 ? 0.9 : 1.1))); req(); }, { passive: false });
    draw();
    return { draw, look };
  }

  function render() {
    const data = parse(location.hash);
    if (!data) { $('#hCode').textContent = 'PanelFlow'; $('#hName').textContent = 'Part viewer'; $('#app').innerHTML = '<div class="empty">Scan the QR code on a PanelFlow part label to see where the part goes.</div>'; return; }
    document.title = `${data.code} ${data.name} – ${data.label}`;
    $('#hCode').textContent = data.code; $('#hName').textContent = data.name;
    const st = { mode: '3d', k: 0, see: true };
    const e = data.eb, ebTxt = v => (v ? v + ' mm' : 'none');
    $('#app').innerHTML = `
      <div class="card"><div class="size">${fmt(data.L)} × ${fmt(data.Wp)} <small>× ${fmt(data.T)} mm</small></div>
        <div class="row"><div><i>Material</i>${esc(data.mat)}</div><div><i>Piece</i>${esc(data.piece)}</div><div><i>Part no.</i>${esc(data.id)}</div></div></div>
      <div class="card"><div class="seg" id="mode"><button data-m="3d" class="on">3D</button><button data-m="front">Front 2D</button><button data-m="side">Side 2D</button><button data-m="top">Top 2D</button></div>
        <div class="seg look" id="tools"><button data-look="front">Front</button><button data-look="right">Right</button><button data-look="back">Back</button><button data-look="left">Left</button><button data-look="top">Top</button><button data-look="start" title="Back to the start view">⟲</button><button id="see" class="on">See-through</button></div>
        <div id="wrap"></div>
        <div class="legend"><span style="--c:#f59e0b">This part</span><span style="--c:#e8d9bd">Carcass</span><span style="--c:#9db8d0">Shutters</span><span style="--c:#cbb791">Back</span></div></div>
      <div class="card"><div class="row"><div><i>Cabinet</i><b>${esc(data.label)}</b> – ${esc(data.cabName)}</div><div><i>Box size</i>${fmt(data.W)} × ${fmt(data.H)} × ${fmt(data.D)}</div>
        <div><i>Location</i>${esc(data.wall || '-')}${data.wallX ? ', ' + esc(data.wallX) + ' mm from wall start' : ''}</div><div><i>Project</i>${esc(data.project)}</div></div></div>
      <div class="card"><i style="font-style:normal;font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px">Edge band</i>
        <div class="eb"><b style="grid-column:2;grid-row:1">L2 ${ebTxt(e[1])}</b><b style="grid-column:1;grid-row:2">W1 ${ebTxt(e[2])}</b><div class="p">${fmt(data.L)} long side ↔</div><b style="grid-column:3;grid-row:2">W2 ${ebTxt(e[3])}</b><b style="grid-column:2;grid-row:3">L1 ${ebTxt(e[0])} (front)</b></div></div>`;
    let v3 = null;
    const paint = () => {
      $('#tools').style.display = st.mode === '3d' ? '' : 'none';
      if (st.mode === '3d') { v3 = mount3d($('#wrap'), data, st); return; }
      v3 = null; $('#wrap').innerHTML = draw(data, st.mode, 0, st.see);
    };
    document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { st.mode = b.dataset.m; document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); paint(); });
    document.querySelectorAll('#tools [data-look]').forEach(b => b.onclick = () => v3 && v3.look(b.dataset.look));
    $('#see').onclick = () => { st.see = !st.see; $('#see').classList.toggle('on', st.see); if (v3) v3.draw(); else paint(); };
    paint();
  }
  window.addEventListener('hashchange', render);
  render();
  // keep the page on the phone so it opens without signal next time
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
